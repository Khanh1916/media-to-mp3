[package]
name = "media-to-mp3"
version = "1.0.0"
edition = "2021"
authors = ["KhanhNN <khanhnn@users.noreply.github.com>"]
description = "High-performance Media to MP3 Downloader & Audio Editor in Rust (YouTube & Facebook)"
license = "MIT"

[lib]
name = "media_to_mp3"
path = "src/lib.rs"

[[bin]]
name = "media-to-mp3"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
tempfile = "3.10"
once_cell = "1.19"
arboard = "3.4"
indicatif = "0.17"
which = "7.0"

[dev-dependencies]
tempfile = "3.10"
