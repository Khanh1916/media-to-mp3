# Build bản chạy độc lập cho Windows và Linux, đưa lên GitHub Releases.
# - Đẩy tag "vX.Y.Z" (trùng version.py): build + tạo Release kèm file tải về.
# - Pull request / chạy tay (Actions > Build & Release > Run workflow): chỉ build và tự kiểm tra,
#   lấy file ở mục Artifacts.
name: Build & Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg:
    name: Minimal FFmpeg (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached FFmpeg
        id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/build_ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config xz-utils ${{ matrix.target == 'windows' && 'gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev' || '' }}
          bash packaging/build_ffmpeg.sh ${{ matrix.target }} ffmpeg-out

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out/
          if-no-files-found: error

  build:
    name: Package (${{ matrix.target }})
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            ffmpeg: ffmpeg.exe
          # Build trên Ubuntu 22.04 (glibc 2.35) để chạy được trên Ubuntu 22.04+, Debian 12+...
          - os: ubuntu-22.04
            target: linux
            ffmpeg: ffmpeg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-bin

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk8.6 libtk8.6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build
        run: python build_exe.py --ffmpeg ffmpeg-bin/${{ matrix.ffmpeg }} --release

      # Chạy chính file đã đóng gói: FFmpeg tối giản phải đủ để chuyển đổi, nhúng ảnh bìa, cắt ghép
      - name: Self-check packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MediaToMP3.exe -ArgumentList '--check' -Wait -PassThru `
               -RedirectStandardOutput check.log -RedirectStandardError check-err.log
          Get-Content check.log, check-err.log
          exit $p.ExitCode

      - name: Self-check packaged app (Linux)
        if: runner.os == 'Linux'
        run: ./dist/MediaToMP3 --check

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches version.py
        run: |
          version=$(python3 -c "from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.py ($version)"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Media to MP3 $GITHUB_REF_NAME" \
            --notes-file packaging/release_notes.md
