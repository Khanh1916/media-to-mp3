name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: media-to-mp3-windows-x64.zip
            binary_name: media-to-mp3.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: media-to-mp3-linux-x64.tar.gz
            binary_name: media-to-mp3
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: media-to-mp3-macos-x64.tar.gz
            binary_name: media-to-mp3
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: media-to-mp3-macos-arm64.tar.gz
            binary_name: media-to-mp3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination staging/
          Copy-Item run.bat, README.md, README_VI.md, LICENSE -Destination staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          cp run.sh README.md README_VI.md LICENSE staging/
          chmod +x staging/${{ matrix.binary_name }} staging/run.sh
          tar -czf ${{ matrix.artifact_name }} -C staging .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums (SHA-256)
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Media to MP3 ${{ github.ref_name }}" \
            --generate-notes
